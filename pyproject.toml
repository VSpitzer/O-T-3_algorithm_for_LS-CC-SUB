[build-system]
requires = ["setuptools>=64"]   # PEP 621 metadata + editable installs
build-backend = "setuptools.build_meta"

[project]
name = "clsp-ib"
version = "0.1.0"
description = "Exact O(T^3) and O(T^4) algorithms for the single-item capacitated lot-sizing problem with inventory bounds"
readme = "README.md"
requires-python = ">=3.8"
# license = { text = "MIT" }   # add a LICENSE file and uncomment
keywords = ["lot-sizing", "operations-research", "dynamic-programming", "CLSP", "inventory-bounds"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
# pulp bundles a CBC binary, so this is enough for the MILP cross-check
milp = ["pulp>=2.7"]
pyomo = ["pyomo>=6.4"]
dev = ["pulp>=2.7"]

[project.scripts]
clsp-ib = "clsp_ib.__main__:main"
clsp-ib-validate = "clsp_ib.validate_milp:main"
clsp-ib-stress = "clsp_ib.stress:main"

[tool.setuptools]
packages = ["clsp_ib"]

[tool.setuptools.package-data]
clsp_ib = ["py.typed"]
